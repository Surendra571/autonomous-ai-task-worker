{% extends "base.html" %}

{% block title %}Sign In - Finance Portal{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="card" data-testid="login-card">
        <div class="card-header" style="justify-content: center; text-align: center;">
            <div>
                <h1 class="card-title" data-testid="login-title">Finance Portal Login</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Sign in to access invoices and payments</p>
            </div>
        </div>

        {% if error %}
        <div class="alert-error" data-testid="login-error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="/finance/login" method="post" data-testid="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="finance_admin" required autofocus data-testid="login-username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required data-testid="login-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;" data-testid="login-submit">
                Sign In
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding: 0.85rem; background: #f1f5f9; border-radius: 6px; font-size: 0.8rem; color: #475569;" data-testid="test-credentials-box">
            <strong>Deterministic Test Credentials:</strong><br>
            Username: <code data-testid="demo-username">finance_admin</code><br>
            Password: <code data-testid="demo-password">password123</code>
        </div>
    </div>
</div>
{% endblock %}
